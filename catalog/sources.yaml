# Input for scripts/gen-catalog. Hand-maintained; models.json is generated from it.
#
# Fields per entry:
#   family, name      display identity
#   params_b          total parameters in billions (from the model card)
#   quality           0-100 cross-family score; see catalog/README.md
#   quality_source    where the score came from
#   active_params_b   optional; MoE active parameters from the model card.
#                     When absent the generator uses params_b * expert_used / expert_count.
#   kv_quant_ok       optional, default true
#   tags              Ollama library tags; each is verified against the registry
#
# Quant policy: q4_K_M always; q8_0 for <= 14B (and 24B); q3_K_M for >= 27B where
# the registry publishes it, else q8_0 (qwen3 32B/30B-A3B, gemma3 27B, deepseek-r1 32B/70B
# have no q3_K_M tag). granite3.3 publishes only size tags, so the quant comes from
# the GGUF file_type.

